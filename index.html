    <style>
        #start {
            border: 1px solid #fff;
            border-radius: 0;
            padding: 8px 14px;

            background: #000;
            color: #fff;

            cursor: pointer;
        }

        #start:hover {
            background: #fff;
            color: #000;
        }

        #start:disabled {
            cursor: default;
            opacity: 0.5;
        }

        .modules {
            display: grid;
            grid-template-columns:
                repeat(6, minmax(0, 1fr));
            gap: 20px;
        }

        .module {
            min-width: 0;

            border-top: 1px solid #fff;
            padding-top: 12px;
        }

        .module h2 {
            margin: 0 0 18px;

            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .field {
            margin-bottom: 22px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            margin-bottom: 8px;

            color: #888;

            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        select {
            width: 100%;

            border: 1px solid #fff;
            border-radius: 0;
            padding: 7px;

            background: #000;
            color: #fff;
        }

        .knob-control {
            display: flex;
            flex-direction: column;
            align-items: center;

            user-select: none;
        }

        .knob {
            position: relative;

            width: 76px;
            height: 66px;

            cursor: ns-resize;
            touch-action: none;
        }

        .knob-arc {
            position: absolute;
            inset: 0;

            width: 76px;
            height: 66px;

            overflow: visible;
            pointer-events: none;
        }

        .knob-track,
        .knob-value-arc {
            fill: none;

            stroke-width: 2;
            stroke-linecap: butt;

            transform-origin: 38px 38px;
            transform: rotate(135deg);
        }

        .knob-track {
            stroke: #333;
        }

        .knob-value-arc {
            stroke: #fff;

            stroke-dasharray: 212.06;
            stroke-dashoffset:
                calc(
                    212.06 -
                    212.06 * var(--normalized)
                );
        }

        .indicator {
            position: absolute;
            left: 50%;
            top: 10px;

            width: 1px;
            height: 28px;

            background: #fff;

            transform:
                translateX(-50%)
                rotate(
                    calc(
                        -135deg +
                        var(--normalized) * 270deg
                    )
                );

            transform-origin:
                50%
                28px;
        }

        .knob-center {
            position: absolute;

            left: 50%;
            top: 37px;

            width: 3px;
            height: 3px;

            background: #fff;

            transform: translate(-50%, -50%);
        }

        .knob input {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;
            pointer-events: none;
        }

        .knob-name {
            margin-top: 9px;

            color: #888;

            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .knob-value {
            margin-top: 4px;

            color: #fff;

            font-size: 11px;
        }

        .keyboard-info {
            margin-top: 30px;
            padding-top: 16px;

            border-top: 1px solid #fff;

            color: #888;

            font-size: 11px;
            text-align: center;
        }

        #note-display {
            margin-top: 9px;

            color: #fff;
        }

        .mobile-keys {
            display: none;

            position: relative;

            height: 120px;
            margin-bottom: 30px;

            border: 1px solid #fff;
        }

        .mobile-keys-white {
            display: flex;

            height: 100%;
        }

        .mobile-key {
            appearance: none;
            -webkit-appearance: none;

            border: 0;
            border-radius: 0;

            font: inherit;

            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-key-white {
            flex: 1 0 0;

            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;

            background: #fff;
            color: #000;

            border-right: 1px solid #000;

            font-size: 11px;
            letter-spacing: 0.06em;
        }

        .mobile-key-white:last-child {
            border-right: 0;
        }

        .mobile-key-white.active {
            background: #888;
        }

        .mobile-keys-black {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 58%;

            pointer-events: none;
        }

        .mobile-key-black {
            position: absolute;
            top: 0;

            width: calc(100% / 7 * 0.6);
            height: 100%;

            left: calc((var(--pos) + 1) * (100% / 7));
            transform: translateX(-50%);

            background: #000;
            border: 1px solid #fff;

            pointer-events: auto;
        }

        .mobile-key-black.active {
            background: #444;
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-keys {
                display: block;
            }
        }

        @media (max-width: 760px) {
            .modules {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .modules {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script type="module">
        const audio =
            new AudioContext();

        const wasmResponse = await fetch(
            "./pkg/versasha_com_bg.wasm"
        );

        if (!wasmResponse.ok) {
            throw new Error(
                `Failed to fetch WASM: ${wasmResponse.status}`
            );
        }

        const wasmBytes =
            await wasmResponse.arrayBuffer();

        const wasmModule =
            await WebAssembly.compile(wasmBytes);

        await audio.audioWorklet.addModule(
            `./js/synth-worklet.js?v=${Date.now()}`
        );

        const node =
            new AudioWorkletNode(
                audio,
                "synth-processor",
                {
                    numberOfInputs: 0,
                    numberOfOutputs: 1,
                    outputChannelCount: [2],

                    processorOptions: {
                        wasmModule
                    }
                }
            );

        node.connect(audio.destination);

        node.port.onmessage = event => {
            if (
                event.data.type === "error" ||
                event.data.type === "warning"
            ) {
                console.error(
                    "[Synth worklet]",
                    event.data.message
                );
            }
        };

        const startButton =
            document.getElementById("start");

        const noteDisplay =
            document.getElementById("note-display");

        async function startAudio() {
            await audio.resume();

            startButton.disabled = true;
            startButton.textContent = "Running";
        }

        startButton.addEventListener(
            "click",
            startAudio
        );

        function send(type, value) {
            node.port.postMessage({
                type,
                value
            });
        }

        function sendNoteOn(frequency) {
            node.port.postMessage({
                type: "note-on",
                frequency
            });
        }

        function sendNoteOff(frequency) {
            node.port.postMessage({
                type: "note-off",
                frequency
            });
        }

        function clamp(value, minimum, maximum) {
            return Math.min(
                Math.max(value, minimum),
                maximum
            );
        }

        function decimalPlaces(step) {
            const text = String(step);

            return text.includes(".")
                ? text.split(".")[1].length
                : 0;
        }

        function initializeKnob({
            inputId,
            outputId,
            format,
            messageType,
            transform = value => value
        }) {
            const input =
                document.getElementById(inputId);

            const output =
                document.getElementById(outputId);

            const wrapper =
                input.closest("[data-knob]");

            const knob =
                wrapper.querySelector(".knob");

            const minimum =
                Number(input.min);

            const maximum =
                Number(input.max);

            const step =
                Number(input.step || 1);

            const precision =
                decimalPlaces(step);

            let dragging = false;
            let previousY = 0;

            function setValue(value) {
                const snapped =
                    Math.round(
                        (value - minimum) / step
                    ) * step + minimum;

                const clamped =
                    clamp(
                        snapped,
                        minimum,
                        maximum
                    );

                input.value =
                    clamped.toFixed(precision);

                const normalized =
                    (clamped - minimum) /
                    (maximum - minimum);

                wrapper.style.setProperty(
                    "--normalized",
                    normalized
                );

                output.value =
                    format(clamped);

                send(
                    messageType,
                    transform(clamped)
                );
            }

            knob.addEventListener(
                "pointerdown",
                event => {
                    dragging = true;
                    previousY = event.clientY;

                    knob.setPointerCapture(
                        event.pointerId
                    );
                }
            );

            knob.addEventListener(
                "pointermove",
                event => {
                    if (!dragging) {
                        return;
                    }

                    const delta =
                        previousY - event.clientY;

                    previousY =
                        event.clientY;

                    const range =
                        maximum - minimum;

                    const sensitivity =
                        event.shiftKey
                            ? 0.0008
                            : 0.004;

                    setValue(
                        Number(input.value) +
                        delta *
                        range *
                        sensitivity
                    );
                }
            );

            knob.addEventListener(
                "pointerup",
                event => {
                    dragging = false;

                    knob.releasePointerCapture(
                        event.pointerId
                    );
                }
            );

            knob.addEventListener(
                "pointercancel",
                () => {
                    dragging = false;
                }
            );

            knob.addEventListener(
                "wheel",
                event => {
                    event.preventDefault();

                    const direction =
                        event.deltaY > 0
                            ? -1
                            : 1;

                    const multiplier =
                        event.shiftKey
                            ? 0.1
                            : 1;

                    setValue(
                        Number(input.value) +
                        direction *
                        step *
                        multiplier
                    );
                },
                {
                    passive: false
                }
            );

            knob.addEventListener(
                "dblclick",
                () => {
                    setValue(
                        Number(input.defaultValue)
                    );
                }
            );

            setValue(
                Number(input.value)
            );
        }

        function logarithmicFrequency(
            position,
            minimum = 20,
            maximum = 18_000
        ) {
            return minimum *
                Math.pow(
                    maximum / minimum,
                    position
                );
        }

        initializeKnob({
            inputId: "osc1-level",
            outputId: "osc1-level-value",
            format: value => value.toFixed(2),
            messageType: "osc1-level"
        });

        initializeKnob({
            inputId: "osc2-level",
            outputId: "osc2-level-value",
            format: value => value.toFixed(2),
            messageType: "osc2-level"
        });

        initializeKnob({
            inputId: "osc2-detune",
            outputId: "osc2-detune-value",
            format: value =>
                `${value > 0 ? "+" : ""}${Math.round(value)} ct`,
            messageType: "osc2-detune"
        });

        initializeKnob({
            inputId: "filter-cutoff",
            outputId: "filter-cutoff-value",
            format: position => {
                const frequency =
                    logarithmicFrequency(position);

                return frequency >= 1000
                    ? `${(frequency / 1000).toFixed(1)} kHz`
                    : `${Math.round(frequency)} Hz`;
            },
            messageType: "filter-cutoff",
            transform: logarithmicFrequency
        });

        initializeKnob({
            inputId: "lfo-frequency",
            outputId: "lfo-frequency-value",
            format: value =>
                `${value.toFixed(1)} Hz`,
            messageType: "lfo-frequency"
        });

        initializeKnob({
            inputId: "lfo-amount",
            outputId: "lfo-amount-value",
            format: value =>
                value.toFixed(1),
            messageType: "lfo-amount"
        });

        initializeKnob({
            inputId: "master-volume",
            outputId: "master-volume-value",
            format: value =>
                value.toFixed(2),
            messageType: "master-volume"
        });

        initializeKnob({
            inputId: "delay-time",
            outputId: "delay-time-value",
            format: value =>
                `${Math.round(value * 1000)} ms`,
            messageType: "delay-time"
        });

        initializeKnob({
            inputId: "delay-feedback",
            outputId: "delay-feedback-value",
            format: value =>
                value.toFixed(2),
            messageType: "delay-feedback"
        });

        initializeKnob({
            inputId: "delay-mix",
            outputId: "delay-mix-value",
            format: value =>
                value.toFixed(2),
            messageType: "delay-mix"
        });

        const osc1Waveform =
            document.getElementById(
                "osc1-waveform"
            );

        const osc2Waveform =
            document.getElementById(
                "osc2-waveform"
            );

        const lfoTarget =
            document.getElementById(
                "lfo-target"
            );

        const delayRoute =
            document.getElementById(
                "delay-route"
            );

        function bindSelect(
            select,
            messageType
        ) {
            select.addEventListener(
                "change",
                () => {
                    send(
                        messageType,
                        Number(select.value)
                    );

                    select.blur();
                }
            );

            select.addEventListener(
                "pointerup",
                () => {
                    queueMicrotask(
                        () => select.blur()
                    );
                }
            );

            send(
                messageType,
                Number(select.value)
            );
        }

        bindSelect(
            osc1Waveform,
            "osc1-waveform"
        );

        bindSelect(
            osc2Waveform,
            "osc2-waveform"
        );

        bindSelect(
            lfoTarget,
            "lfo-target"
        );

        bindSelect(
            delayRoute,
            "delay-route"
        );

        const notes = {
            a: {
                frequency: 261.63,
                name: "C4"
            },

            w: {
                frequency: 277.18,
                name: "C#4"
            },

            s: {
                frequency: 293.66,
                name: "D4"
            },

            e: {
                frequency: 311.13,
                name: "D#4"
            },

            d: {
                frequency: 329.63,
                name: "E4"
            },

            f: {
                frequency: 349.23,
                name: "F4"
            },

            t: {
                frequency: 369.99,
                name: "F#4"
            },

            g: {
                frequency: 392.0,
                name: "G4"
            },

            y: {
                frequency: 415.3,
                name: "G#4"
            },

            h: {
                frequency: 440.0,
                name: "A4"
            },

            u: {
                frequency: 466.16,
                name: "A#4"
            },

            j: {
                frequency: 493.88,
                name: "B4"
            }
        };

        const heldKeys =
            new Set();

        async function pressKey(key) {
            const note = notes[key];

            if (
                !note ||
                heldKeys.has(key)
            ) {
                return;
            }

            heldKeys.add(key);

            await startAudio();

            sendNoteOn(note.frequency);

            noteDisplay.textContent =
                `${note.name} — ${note.frequency.toFixed(2)} Hz`;
        }

        function releaseKey(key) {
            const note = notes[key];

            if (
                !note ||
                !heldKeys.has(key)
            ) {
                return;
            }

            heldKeys.delete(key);

            sendNoteOff(note.frequency);

            const remaining =
                Array.from(heldKeys).at(-1);

            noteDisplay.textContent =
                remaining
                    ? `${notes[remaining].name} — ${notes[remaining].frequency.toFixed(2)} Hz`
                    : "---";
        }

        const mobileKeys =
            document.querySelectorAll(
                ".mobile-key"
            );

        for (const button of mobileKeys) {
            const key =
                button.dataset.key;

            button.addEventListener(
                "pointerdown",
                event => {
                    event.preventDefault();

                    // keep pointerup/pointercancel targeting this button even if the
                    // finger drifts off its boundary mid-hold — without capture, a
                    // stray pointerleave would cut the note early on real touch input
                    button.setPointerCapture(
                        event.pointerId
                    );

                    button.classList.add(
                        "active"
                    );

                    pressKey(key);
                }
            );

            for (const type of [
                "pointerup",
                "pointercancel"
            ]) {
                button.addEventListener(
                    type,
                    () => {
                        button.classList.remove(
                            "active"
                        );

                        releaseKey(key);
                    }
                );
            }
        }

        window.addEventListener(
            "keydown",
            event => {
                const key =
                    event.key.toLowerCase();

                if (!notes[key]) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                pressKey(key);
            },
            true
        );

        window.addEventListener(
            "keyup",
            event => {
                const key =
                    event.key.toLowerCase();

                if (!notes[key]) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                releaseKey(key);
            },
            true
        );

        window.addEventListener(
            "blur",
            () => {
                for (const key of [
                    ...heldKeys
                ]) {
                    releaseKey(key);
                }
            }
        );
    </script>
</body>
</html>
