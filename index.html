<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>versasha.com</title>

    <meta
        name="description"
        content="Sasha Ruiz de Aguirre. DJ & Producer. Browser-based music tools. Presskit and music releases."
    >

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://versasha.com/">
    <meta property="og:title" content="versasha.com">
    <meta
        property="og:description"
        content="Sasha Ruiz de Aguirre. DJ & Producer. Browser-based music tools. Presskit and music releases."
    >
    <meta property="og:image" content="https://versasha.com/img/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="versasha.com">
    <meta
        name="twitter:description"
        content="Sasha Ruiz de Aguirre. DJ & Producer. Browser-based music tools. Presskit and music releases."
    >
    <meta name="twitter:image" content="https://versasha.com/img/og-image.jpg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

    <style>
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .engine-tabs {
            display: flex;
            gap: 8px;

            margin-left: auto;
        }

        .engine-tab {
            border: 1px solid #fff;
            border-radius: 0;
            padding: 8px 14px;

            background: #000;
            color: #fff;

            cursor: pointer;
        }

        .engine-tab:hover {
            background: #fff;
            color: #000;
        }

        .engine-tab.active {
            background: #fff;
            color: #000;
        }

        #start {
            border: 1px solid #fff;
            border-radius: 0;
            padding: 8px 14px;

            background: #000;
            color: #fff;

            cursor: pointer;
        }

        #start:hover {
            background: #fff;
            color: #000;
        }

        #start:disabled {
            cursor: default;
            opacity: 0.5;
        }

        .modules {
            display: grid;
            grid-template-columns:
                repeat(6, minmax(0, 1fr));
            gap: 20px;
        }

        .module {
            min-width: 0;

            border-top: 1px solid #fff;
            padding-top: 12px;
        }

        .module h2 {
            margin: 0 0 18px;

            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .field {
            margin-bottom: 22px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            margin-bottom: 8px;

            color: #888;

            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        select {
            width: 100%;

            border: 1px solid #fff;
            border-radius: 0;
            padding: 7px;

            background: #000;
            color: #fff;
        }

        .knob-control {
            display: flex;
            flex-direction: column;
            align-items: center;

            user-select: none;
        }

        .knob {
            position: relative;

            width: 76px;
            height: 66px;

            cursor: ns-resize;
            touch-action: none;
        }

        .knob-arc {
            position: absolute;
            inset: 0;

            width: 76px;
            height: 66px;

            overflow: visible;
            pointer-events: none;
        }

        .knob-track,
        .knob-value-arc {
            fill: none;

            stroke-width: 2;
            stroke-linecap: butt;

            transform-origin: 38px 38px;
            transform: rotate(135deg);
        }

        .knob-track {
            stroke: #333;
        }

        .knob-value-arc {
            stroke: #fff;

            stroke-dasharray: 212.06;
            stroke-dashoffset:
                calc(
                    212.06 -
                    212.06 * var(--normalized)
                );
        }

        .indicator {
            position: absolute;
            left: 50%;
            top: 10px;

            width: 1px;
            height: 28px;

            background: #fff;

            transform:
                translateX(-50%)
                rotate(
                    calc(
                        -135deg +
                        var(--normalized) * 270deg
                    )
                );

            transform-origin:
                50%
                28px;
        }

        .knob-center {
            position: absolute;

            left: 50%;
            top: 37px;

            width: 3px;
            height: 3px;

            background: #fff;

            transform: translate(-50%, -50%);
        }

        .knob input {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;
            pointer-events: none;
        }

        .knob-name {
            margin-top: 9px;

            color: #888;

            font-size: 10px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .knob-value {
            margin-top: 4px;

            color: #fff;

            font-size: 11px;
        }

        .keyboard-info {
            margin-top: 30px;
            padding-top: 16px;

            border-top: 1px solid #fff;

            color: #888;

            font-size: 11px;
            text-align: center;
        }

        #note-display {
            margin-top: 9px;

            color: #fff;
        }

        .mobile-keys {
            display: none;

            position: relative;

            height: 120px;
            margin-bottom: 30px;

            border: 1px solid #fff;
        }

        .mobile-keys-white {
            display: flex;

            height: 100%;
        }

        .mobile-key {
            appearance: none;
            -webkit-appearance: none;

            border: 0;
            border-radius: 0;

            font: inherit;

            cursor: pointer;
            touch-action: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-key-white {
            flex: 1 0 0;

            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;

            background: #fff;
            color: #000;

            border-right: 1px solid #000;

            font-size: 11px;
            letter-spacing: 0.06em;
        }

        .mobile-key-white:last-child {
            border-right: 0;
        }

        .mobile-key-white.active {
            background: #888;
        }

        .mobile-keys-black {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 58%;

            pointer-events: none;
        }

        .mobile-key-black {
            position: absolute;
            top: 0;

            width: calc(100% / 7 * 0.6);
            height: 100%;

            left: calc((var(--pos) + 1) * (100% / 7));
            transform: translateX(-50%);

            background: #000;
            border: 1px solid #fff;

            pointer-events: auto;
        }

        .mobile-key-black.active {
            background: #444;
        }

        @media (hover: none) and (pointer: coarse) {
            .mobile-keys {
                display: block;
            }
        }

        @media (max-width: 760px) {
            .modules {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .modules {
                grid-template-columns: 1fr;
            }
        }

        .drum-status {
            margin-bottom: 20px;

            color: #888;

            font-size: 11px;
            text-transform: uppercase;
        }

        .drum-transport {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;

            margin-bottom: 30px;
            padding-bottom: 20px;

            border-bottom: 1px solid #fff;
        }

        .drum-transport button {
            border: 1px solid #fff;
            border-radius: 0;
            padding: 8px 14px;

            background: #000;
            color: #fff;

            cursor: pointer;
        }

        .drum-transport button:hover {
            background: #fff;
            color: #000;
        }

        .drum-transport label {
            display: flex;
            align-items: center;
            gap: 8px;

            color: #888;

            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .drum-transport input {
            border: 1px solid #fff;
            border-radius: 0;
            padding: 6px;

            background: #000;
            color: #fff;

            font: inherit;
        }

        .drum-transport input[type="number"] {
            width: 70px;
        }

        .drum-sequencer {
            display: flex;
            flex-direction: column;
            gap: 4px;

            margin-bottom: 30px;

            overflow-x: auto;
        }

        .drum-track-row {
            display: flex;
            align-items: stretch;
            gap: 6px;

            min-width: fit-content;
        }

        .drum-track-label {
            flex: 0 0 88px;

            border: 1px solid #fff;
            border-radius: 0;
            padding: 0 8px;

            background: #000;
            color: #fff;

            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-align: left;

            cursor: pointer;
        }

        .drum-track-label:hover {
            background: #fff;
            color: #000;
        }

        .drum-track-mute,
        .drum-track-solo {
            flex: 0 0 26px;

            border: 1px solid #fff;
            border-radius: 0;

            background: #000;
            color: #888;

            font-size: 11px;

            cursor: pointer;
        }

        .drum-track-mute.active {
            background: #fff;
            color: #000;
        }

        .drum-track-solo.active {
            background: #888;
            color: #000;
        }

        .drum-track-steps {
            display: flex;
            flex: 1;
            gap: 2px;
        }

        .drum-step-cell {
            flex: 1;
            aspect-ratio: 1;
            max-width: 30px;

            border: 1px solid #333;
            border-radius: 0;

            background: #000;

            cursor: pointer;
        }

        .drum-step-cell:nth-child(4n + 1) {
            border-left: 1px solid #666;
        }

        .drum-step-cell.active {
            background: #888;
        }

        .drum-step-cell.current {
            border-color: #fff;
        }

        .drum-step-cell.active.current {
            background: #fff;
        }

        .drum-knob-rack {
            display: flex;
            flex: 0 0 163px;
            justify-content: flex-start;
            gap: 8px;

            padding-left: 10px;

            border-left: 1px solid #333;
        }

        .drum-knob {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 32px;
        }

        .drum-knob-dial {
            --angle: -135deg;

            position: relative;

            width: 26px;
            height: 26px;

            border: 1px solid #fff;
            border-radius: 50%;

            background: #000;

            cursor: ns-resize;
            touch-action: none;
            user-select: none;
        }

        .drum-knob-dial::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 50%;

            width: 2px;
            height: 9px;

            background: #fff;

            transform: translateX(-50%) rotate(var(--angle));
            transform-origin: 50% 11px;
        }

        .drum-knob-dial:hover,
        .drum-knob-dial:active {
            border-color: #888;
        }

        .drum-knob-dial:hover::after,
        .drum-knob-dial:active::after {
            background: #888;
        }

        .drum-knob-label {
            margin-top: 4px;

            color: #888;

            font-size: 8px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <main class="page">
        <header>
            <h1>versasha.com</h1>

            <nav class="engine-tabs" role="tablist">
                <button type="button" class="engine-tab active" data-view="synth" role="tab" aria-selected="true">Synth</button>
                <button type="button" class="engine-tab" data-view="drums" role="tab" aria-selected="false">Drums</button>
            </nav>

            <button
                id="start"
                type="button"
            >
                Start
            </button>
        </header>

        <div id="synth-view" class="view">
        <div
            class="mobile-keys"
            id="mobile-keys"
            role="group"
            aria-label="On-screen keyboard"
        >
            <div class="mobile-keys-white">
                <button class="mobile-key mobile-key-white" type="button" data-key="a">C</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="s">D</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="d">E</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="f">F</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="g">G</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="h">A</button>
                <button class="mobile-key mobile-key-white" type="button" data-key="j">B</button>
            </div>

            <div class="mobile-keys-black">
                <button class="mobile-key mobile-key-black" type="button" data-key="w" style="--pos: 0;"></button>
                <button class="mobile-key mobile-key-black" type="button" data-key="e" style="--pos: 1;"></button>
                <button class="mobile-key mobile-key-black" type="button" data-key="t" style="--pos: 3;"></button>
                <button class="mobile-key mobile-key-black" type="button" data-key="y" style="--pos: 4;"></button>
                <button class="mobile-key mobile-key-black" type="button" data-key="u" style="--pos: 5;"></button>
            </div>
        </div>

        <div class="modules">
            <section class="module">
                <h2>Oscillator 1</h2>

                <div class="field">
                    <label
                        class="field-label"
                        for="osc1-waveform"
                    >
                        Waveform
                    </label>

                    <select id="osc1-waveform">
                        <option value="0">Sine</option>
                        <option value="1">Square</option>
                        <option value="2">Saw</option>
                        <option value="3">Triangle</option>
                    </select>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="osc1-level"
                    data-output="osc1-level-value"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="osc1-level"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1"
                        >
                    </div>

                    <div class="knob-name">
                        Level
                    </div>

                    <output
                        id="osc1-level-value"
                        class="knob-value"
                    >
                        1.00
                    </output>
                </div>
            </section>

            <section class="module">
                <h2>Oscillator 2</h2>

                <div class="field">
                    <label
                        class="field-label"
                        for="osc2-waveform"
                    >
                        Waveform
                    </label>

                    <select id="osc2-waveform">
                        <option value="0">Sine</option>
                        <option value="1">Square</option>
                        <option value="2">Saw</option>
                        <option value="3">Triangle</option>
                    </select>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="osc2-level"
                    data-output="osc2-level-value"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="osc2-level"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1"
                        >
                    </div>

                    <div class="knob-name">
                        Level
                    </div>

                    <output
                        id="osc2-level-value"
                        class="knob-value"
                    >
                        1.00
                    </output>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="osc2-detune"
                    data-output="osc2-detune-value"
                    style="margin-top: 18px;"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="osc2-detune"
                            type="range"
                            min="-100"
                            max="100"
                            step="1"
                            value="0"
                        >
                    </div>

                    <div class="knob-name">
                        Detune
                    </div>

                    <output
                        id="osc2-detune-value"
                        class="knob-value"
                    >
                        0 ct
                    </output>
                </div>
            </section>

            <section class="module">
                <h2>Filter</h2>

                <div class="field">
                    <label
                        class="field-label"
                        for="filter-type"
                    >
                        Type
                    </label>

                    <select id="filter-type">
                        <option value="0" selected>Low Pass</option>
                        <option value="1">High Pass</option>
                        <option value="2">Band Pass</option>
                    </select>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="filter-cutoff"
                    data-output="filter-cutoff-value"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="filter-cutoff"
                            type="range"
                            min="0"
                            max="1"
                            step="0.001"
                            value="0.75"
                        >
                    </div>

                    <div class="knob-name">
                        Cutoff
                    </div>

                    <output
                        id="filter-cutoff-value"
                        class="knob-value"
                    >
                        3.3 kHz
                    </output>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="filter-resonance"
                    data-output="filter-resonance-value"
                    style="margin-top: 18px;"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="filter-resonance"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="0"
                        >
                    </div>

                    <div class="knob-name">
                        Resonance
                    </div>

                    <output
                        id="filter-resonance-value"
                        class="knob-value"
                    >
                        0.00
                    </output>
                </div>
            </section>

            <section class="module">
                <h2>LFO</h2>

                <div class="field">
                    <label
                        class="field-label"
                        for="lfo-target"
                    >
                        Target
                    </label>

                    <select id="lfo-target">
                        <option value="0">Pitch</option>
                        <option value="1" selected>Vibrato</option>
                        <option value="2">Volume</option>
                        <option value="3">Filter</option>
                    </select>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="lfo-frequency"
                    data-output="lfo-frequency-value"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle
                                class="knob-value-arc"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>
                        </svg>

                        <div class="indicator"></div>
                        <div class="knob-center"></div>

                        <input
                            id="lfo-frequency"
                            type="range"
                            min="0.1"
                            max="20"
                            step="0.1"
                            value="5"
                        >
                    </div>

                    <div class="knob-name">
                        Rate
                    </div>

                    <output
                        id="lfo-frequency-value"
                        class="knob-value"
                    >
                        5.0 Hz
                    </output>
                </div>

                <div
                    class="knob-control"
                    data-knob
                    data-input="lfo-amount"
                    data-output="lfo-amount-value"
                    style="margin-top: 18px;"
                >
                    <div class="knob">
                        <svg
                            class="knob-arc"
                            viewBox="0 0 76 66"
                            aria-hidden="true"
                        >
                            <circle
                                class="knob-track"
                                cx="38"
                                cy="38"
                                r="25"
                                pathLength="270"
                                stroke-dasharray="270 90"
                            ></circle>

                            <circle

    <script type="module">
        const audio =
            new AudioContext();

        const wasmResponse = await fetch(
            "./pkg/versasha_com_bg.wasm"
        );

        if (!wasmResponse.ok) {
            throw new Error(
                `Failed to fetch WASM: ${wasmResponse.status}`
            );
        }

        const wasmBytes =
            await wasmResponse.arrayBuffer();

        const wasmModule =
            await WebAssembly.compile(wasmBytes);

        await audio.audioWorklet.addModule(
            `./js/synth-worklet.js?v=${Date.now()}`
        );

        const node =
            new AudioWorkletNode(
                audio,
                "synth-processor",
                {
                    numberOfInputs: 0,
                    numberOfOutputs: 1,
                    outputChannelCount: [2],

                    processorOptions: {
                        wasmModule
                    }
                }
            );

        node.connect(audio.destination);

        node.port.onmessage = event => {
            if (
                event.data.type === "error" ||
                event.data.type === "warning"
            ) {
                console.error(
                    "[Synth worklet]",
                    event.data.message
                );
            }
        };

        const startButton =
            document.getElementById("start");

        const noteDisplay =
            document.getElementById("note-display");

        async function startAudio() {
            await audio.resume();

            startButton.disabled = true;
            startButton.textContent = "Running";
        }

        startButton.addEventListener(
            "click",
            startAudio
        );

        function send(type, value) {
            node.port.postMessage({
                type,
                value
            });
        }

        function sendNoteOn(frequency) {
            node.port.postMessage({
                type: "note-on",
                frequency
            });
        }

        function sendNoteOff(frequency) {
            node.port.postMessage({
                type: "note-off",
                frequency
            });
        }

        function clamp(value, minimum, maximum) {
            return Math.min(
                Math.max(value, minimum),
                maximum
            );
        }

        function decimalPlaces(step) {
            const text = String(step);

            return text.includes(".")
                ? text.split(".")[1].length
                : 0;
        }

        function initializeKnob({
            inputId,
            outputId,
            format,
            messageType,
            transform = value => value
        }) {
            const input =
                document.getElementById(inputId);

            const output =
                document.getElementById(outputId);

            const wrapper =
                input.closest("[data-knob]");

            const knob =
                wrapper.querySelector(".knob");

            const minimum =
                Number(input.min);

            const maximum =
                Number(input.max);

            const step =
                Number(input.step || 1);

            const precision =
                decimalPlaces(step);

            let dragging = false;
            let previousY = 0;

            function setValue(value) {
                const snapped =
                    Math.round(
                        (value - minimum) / step
                    ) * step + minimum;

                const clamped =
                    clamp(
                        snapped,
                        minimum,
                        maximum
                    );

                input.value =
                    clamped.toFixed(precision);

                const normalized =
                    (clamped - minimum) /
                    (maximum - minimum);

                wrapper.style.setProperty(
                    "--normalized",
                    normalized
                );

                output.value =
                    format(clamped);

                send(
                    messageType,
                    transform(clamped)
                );
            }

            knob.addEventListener(
                "pointerdown",
                event => {
                    dragging = true;
                    previousY = event.clientY;

                    knob.setPointerCapture(
                        event.pointerId
                    );
                }
            );

            knob.addEventListener(
                "pointermove",
                event => {
                    if (!dragging) {
                        return;
                    }

                    const delta =
                        previousY - event.clientY;

                    previousY =
                        event.clientY;

                    const range =
                        maximum - minimum;

                    const sensitivity =
                        event.shiftKey
                            ? 0.0008
                            : 0.004;

                    setValue(
                        Number(input.value) +
                        delta *
                        range *
                        sensitivity
                    );
                }
            );

            knob.addEventListener(
                "pointerup",
                event => {
                    dragging = false;

                    knob.releasePointerCapture(
                        event.pointerId
                    );
                }
            );

            knob.addEventListener(
                "pointercancel",
                () => {
                    dragging = false;
                }
            );

            knob.addEventListener(
                "wheel",
                event => {
                    event.preventDefault();

                    const direction =
                        event.deltaY > 0
                            ? -1
                            : 1;

                    const multiplier =
                        event.shiftKey
                            ? 0.1
                            : 1;

                    setValue(
                        Number(input.value) +
                        direction *
                        step *
                        multiplier
                    );
                },
                {
                    passive: false
                }
            );

            knob.addEventListener(
                "dblclick",
                () => {
                    setValue(
                        Number(input.defaultValue)
                    );
                }
            );

            setValue(
                Number(input.value)
            );
        }

        function logarithmicFrequency(
            position,
            minimum = 20,
            maximum = 18_000
        ) {
            return minimum *
                Math.pow(
                    maximum / minimum,
                    position
                );
        }

        initializeKnob({
            inputId: "osc1-level",
            outputId: "osc1-level-value",
            format: value => value.toFixed(2),
            messageType: "osc1-level"
        });

        initializeKnob({
            inputId: "osc2-level",
            outputId: "osc2-level-value",
            format: value => value.toFixed(2),
            messageType: "osc2-level"
        });

        initializeKnob({
            inputId: "osc2-detune",
            outputId: "osc2-detune-value",
            format: value =>
                `${value > 0 ? "+" : ""}${Math.round(value)} ct`,
            messageType: "osc2-detune"
        });

        initializeKnob({
            inputId: "filter-cutoff",
            outputId: "filter-cutoff-value",
            format: position => {
                const frequency =
                    logarithmicFrequency(position);

                return frequency >= 1000
                    ? `${(frequency / 1000).toFixed(1)} kHz`
                    : `${Math.round(frequency)} Hz`;
            },
            messageType: "filter-cutoff",
            transform: logarithmicFrequency
        });

        initializeKnob({
            inputId: "filter-resonance",
            outputId: "filter-resonance-value",
            format: value =>
                value.toFixed(2),
            messageType: "filter-resonance"
        });

        initializeKnob({
            inputId: "lfo-frequency",
            outputId: "lfo-frequency-value",
            format: value =>
                `${value.toFixed(1)} Hz`,
            messageType: "lfo-frequency"
        });

        initializeKnob({
            inputId: "lfo-amount",
            outputId: "lfo-amount-value",
            format: value =>
                value.toFixed(1),
            messageType: "lfo-amount"
        });

        initializeKnob({
            inputId: "master-volume",
            outputId: "master-volume-value",
            format: value =>
                value.toFixed(2),
            messageType: "master-volume"
        });

        initializeKnob({
            inputId: "delay-time",
            outputId: "delay-time-value",
            format: value =>
                `${Math.round(value * 1000)} ms`,
            messageType: "delay-time"
        });

        initializeKnob({
            inputId: "delay-feedback",
            outputId: "delay-feedback-value",
            format: value =>
                value.toFixed(2),
            messageType: "delay-feedback"
        });

        initializeKnob({
            inputId: "delay-mix",
            outputId: "delay-mix-value",
            format: value =>
                value.toFixed(2),
            messageType: "delay-mix"
        });

        const osc1Waveform =
            document.getElementById(
                "osc1-waveform"
            );

        const osc2Waveform =
            document.getElementById(
                "osc2-waveform"
            );

        const lfoTarget =
            document.getElementById(
                "lfo-target"
            );

        const delayRoute =
            document.getElementById(
                "delay-route"
            );

        const filterType =
            document.getElementById(
                "filter-type"
            );

        function bindSelect(
            select,
            messageType
        ) {
            select.addEventListener(
                "change",
                () => {
                    send(
                        messageType,
                        Number(select.value)
                    );

                    select.blur();
                }
            );

            send(
                messageType,
                Number(select.value)
            );
        }

        bindSelect(
            osc1Waveform,
            "osc1-waveform"
        );

        bindSelect(
            osc2Waveform,
            "osc2-waveform"
        );

        bindSelect(
            lfoTarget,
            "lfo-target"
        );

        bindSelect(
            delayRoute,
            "delay-route"
        );

        bindSelect(
            filterType,
            "filter-type"
        );

        const notes = {
            a: {
                frequency: 261.63,
                name: "C4"
            },

            w: {
                frequency: 277.18,
                name: "C#4"
            },

            s: {
                frequency: 293.66,
                name: "D4"
            },

            e: {
                frequency: 311.13,
                name: "D#4"
            },

            d: {
                frequency: 329.63,
                name: "E4"
            },

            f: {
                frequency: 349.23,
                name: "F4"
            },

            t: {
                frequency: 369.99,
                name: "F#4"
            },

            g: {
                frequency: 392.0,
                name: "G4"
            },

            y: {
                frequency: 415.3,
                name: "G#4"
            },

            h: {
                frequency: 440.0,
                name: "A4"
            },

            u: {
                frequency: 466.16,
                name: "A#4"
            },

            j: {
                frequency: 493.88,
                name: "B4"
            }
        };

        const heldKeys =
            new Set();

        async function pressKey(key) {
            const note = notes[key];

            if (
                !note ||
                heldKeys.has(key)
            ) {
                return;
            }

            heldKeys.add(key);

            await startAudio();

            sendNoteOn(note.frequency);

            noteDisplay.textContent =
                `${note.name} — ${note.frequency.toFixed(2)} Hz`;
        }

        function releaseKey(key) {
            const note = notes[key];

            if (
                !note ||
                !heldKeys.has(key)
            ) {
                return;
            }

            heldKeys.delete(key);

            sendNoteOff(note.frequency);

            const remaining =
                Array.from(heldKeys).at(-1);

            noteDisplay.textContent =
                remaining
                    ? `${notes[remaining].name} — ${notes[remaining].frequency.toFixed(2)} Hz`
                    : "---";
        }

        const mobileKeys =
            document.querySelectorAll(
                ".mobile-key"
            );

        for (const button of mobileKeys) {
            const key =
                button.dataset.key;

            button.addEventListener(
                "pointerdown",
                event => {
                    event.preventDefault();

                    // keep pointerup/pointercancel targeting this button even if the
                    // finger drifts off its boundary mid-hold — without capture, a
                    // stray pointerleave would cut the note early on real touch input
                    button.setPointerCapture(
                        event.pointerId
                    );

                    button.classList.add(
                        "active"
                    );

                    pressKey(key);
                }
            );

            for (const type of [
                "pointerup",
                "pointercancel"
            ]) {
                button.addEventListener(
                    type,
                    () => {
                        button.classList.remove(
                            "active"
                        );

                        releaseKey(key);
                    }
                );
            }
        }

        window.addEventListener(
            "keydown",
            event => {
                const key =
                    event.key.toLowerCase();

                if (!notes[key]) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                pressKey(key);
            },
            true
        );

        window.addEventListener(
            "keyup",
            event => {
                const key =
                    event.key.toLowerCase();

                if (!notes[key]) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                releaseKey(key);
            },
            true
        );

        window.addEventListener(
            "blur",
            () => {
                for (const key of [
                    ...heldKeys
                ]) {
                    releaseKey(key);
                }
            }
        );

        // --- Drum machine (Drums tab) --------------------------------------
        //
        // Reuses the same AudioContext (`audio`) and already-compiled
        // `wasmModule` from the synth setup above -- both worklet nodes end
        // up connected to the same audio.destination, so the drum sequencer
        // keeps playing in the background regardless of which tab is
        // visible, and the synth can be played live right on top of it.

        const DRUM_TRACKS = [
            "Kick", "Snare", "Clap", "Rimshot",
            "Tom Lo", "Tom Mid", "Tom Hi",
            "Hat Cl", "Hat Op", "Crash", "Ride"
        ];

        const DRUM_STEP_COUNT = 16;

        // params per track, in the order their knobs should render --
        // mirrors DrumMachine's build_all_tracks order and SampleTrackType's
        // supports_tune/envelope/attack/snappy gating in sample_track.rs
        const DRUM_TRACK_PARAMS = [
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }, { key: "attack", label: "Atk" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }, { key: "snappy", label: "Snap" }],
            [{ key: "level", label: "Lvl" }],
            [{ key: "level", label: "Lvl" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "decay", label: "Dcy" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }],
            [{ key: "level", label: "Lvl" }, { key: "tune", label: "Tune" }]
        ];

        const drumTrackStatus = new Array(DRUM_TRACKS.length).fill(0);

        const drumStatus = document.getElementById("drum-status");
        const drumSequencerEl = document.getElementById("drum-sequencer");

        async function fetchAndDecodeDrumSample(path) {
            const response = await fetch(path);

            if (!response.ok) {
                throw new Error(`Failed to fetch ${path}: ${response.status}`);
            }

            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audio.decodeAudioData(arrayBuffer);

            return audioBuffer.getChannelData(0);
        }

        const DRUM_SAMPLE_FILES = {
            kick: "./samples/kick.wav",
            snare: "./samples/snare.wav",
            clap: "./samples/clap.wav",
            rimshot: "./samples/rimshot.wav",
            tomLow: "./samples/tom-low.wav",
            tomMid: "./samples/tom-mid.wav",
            tomHi: "./samples/tom-hi.wav",
            hihatClosed: "./samples/hihat-closed.wav",
            hihatOpen: "./samples/hihat-open.wav",
            crash: "./samples/crash.wav",
            ride: "./samples/ride.wav"
        };

        const drumSamples = {};

        for (const [key, path] of Object.entries(DRUM_SAMPLE_FILES)) {
            drumSamples[key] = await fetchAndDecodeDrumSample(path);
        }

        drumStatus.textContent = "Loading engine…";

        await audio.audioWorklet.addModule(
            `./js/drum-worklet.js?v=${Date.now()}`
        );

        const drumNode = new AudioWorkletNode(
            audio,
            "drum-machine-processor",
            {
                numberOfInputs: 0,
                numberOfOutputs: 1,
                outputChannelCount: [2],
                processorOptions: {
                    wasmModule,
                    samples: drumSamples
                }
            }
        );

        drumNode.connect(audio.destination);

        drumNode.port.onmessage = event => {
            const message = event.data;

            if (message.type === "error" || message.type === "warning") {
                console.error("[Drum machine worklet]", message.message);
                return;
            }

            if (message.type === "step") {
                highlightDrumStep(message.step);
            }
        };

        drumStatus.textContent = "Ready — press Play or click a track name";

        function sendDrum(type, payload = {}) {
            drumNode.port.postMessage({ type, ...payload });
        }

        function updateDrumTrackButtons(row, trackIndex) {
            const mute = row.querySelector(".drum-track-mute");
            const solo = row.querySelector(".drum-track-solo");

            mute.classList.toggle("active", drumTrackStatus[trackIndex] === 2);
            solo.classList.toggle("active", drumTrackStatus[trackIndex] === 1);
        }

        const DRUM_KNOB_MIN_ANGLE = -135;
        const DRUM_KNOB_MAX_ANGLE = 135;
        const DRUM_KNOB_DRAG_RANGE_PX = 150;

        // knobs only ever know a 0..1 position -- these ranges convert that
        // into the physical units DrumMachine's setters expect. "level" and
        // "snappy" are already 0..1 in the engine, so they're left out and
        // passed straight through
        const DRUM_PARAM_RANGES = {
            tune: { min: -24, max: 24 }, // semitones, matches Tune::MAX_SEMITONES
            attack: { min: 0.001, max: 0.1 }, // seconds
            decay: { min: 0.02, max: 1.5 } // seconds
        };

        const DRUM_PARAM_MESSAGE_TYPES = {
            level: "set-track-volume",
            tune: "set-track-tune",
            attack: "set-track-attack",
            decay: "set-track-decay",
            snappy: "set-track-snappy"
        };

        function mapDrumKnobValue(paramKey, knobValue) {
            const range = DRUM_PARAM_RANGES[paramKey];
            if (!range) return knobValue;
            return range.min + knobValue * (range.max - range.min);
        }

        function formatDrumKnobValue(paramKey, physicalValue) {
            switch (paramKey) {
                case "tune":
                    return `${physicalValue >= 0 ? "+" : ""}${physicalValue.toFixed(1)}st`;
                case "attack":
                case "decay":
                    return `${(physicalValue * 1000).toFixed(0)}ms`;
                default:
                    return physicalValue.toFixed(2);
            }
        }

        function createDrumKnob(param, initialValue, onChange) {
            const wrapper = document.createElement("div");
            wrapper.className = "drum-knob";

            const dial = document.createElement("div");
            dial.className = "drum-knob-dial";

            const labelEl = document.createElement("div");
            labelEl.className = "drum-knob-label";
            labelEl.textContent = param.label;

            let value = initialValue;

            function applyValue(nextValue) {
                value = Math.min(1, Math.max(0, nextValue));

                const angle = DRUM_KNOB_MIN_ANGLE + value * (DRUM_KNOB_MAX_ANGLE - DRUM_KNOB_MIN_ANGLE);
                dial.style.setProperty("--angle", `${angle}deg`);
                dial.title = `${param.label}: ${formatDrumKnobValue(param.key, mapDrumKnobValue(param.key, value))}`;
            }

            dial.addEventListener("pointerdown", event => {
                dial.setPointerCapture(event.pointerId);

                const startY = event.clientY;
                const startValue = value;

                function handleMove(moveEvent) {
                    const delta = (startY - moveEvent.clientY) / DRUM_KNOB_DRAG_RANGE_PX;
                    applyValue(startValue + delta);
                    if (onChange) onChange(value);
                }

                function handleUp() {
                    dial.removeEventListener("pointermove", handleMove);
                    dial.removeEventListener("pointerup", handleUp);
                }

                dial.addEventListener("pointermove", handleMove);
                dial.addEventListener("pointerup", handleUp);
            });

            dial.addEventListener("wheel", event => {
                event.preventDefault();
                applyValue(value - Math.sign(event.deltaY) * 0.02);
                if (onChange) onChange(value);
            }, { passive: false });

            dial.addEventListener("dblclick", () => {
                applyValue(initialValue);
                if (onChange) onChange(value);
            });

            applyValue(initialValue);

            wrapper.append(dial, labelEl);
            return wrapper;
        }

        function highlightDrumStep(currentStep) {
            drumSequencerEl.querySelectorAll(".drum-step-cell").forEach(cell => {
                cell.classList.toggle(
                    "current",
                    Number(cell.dataset.step) === currentStep
                );
            });
        }

        DRUM_TRACKS.forEach((label, trackIndex) => {
            const row = document.createElement("div");
            row.className = "drum-track-row";

            const trigger = document.createElement("button");
            trigger.type = "button";
            trigger.className = "drum-track-label";
            trigger.textContent = label;

            trigger.addEventListener("click", async () => {
                await startAudio();
                sendDrum("trigger-track", { track: trackIndex });
            });

            const mute = document.createElement("button");
            mute.type = "button";
            mute.className = "drum-track-mute";
            mute.textContent = "M";

            mute.addEventListener("click", () => {
                drumTrackStatus[trackIndex] = drumTrackStatus[trackIndex] === 2 ? 0 : 2;
                updateDrumTrackButtons(row, trackIndex);
                sendDrum("set-track-status", { track: trackIndex, value: drumTrackStatus[trackIndex] });
            });

            const solo = document.createElement("button");
            solo.type = "button";
            solo.className = "drum-track-solo";
            solo.textContent = "S";

            solo.addEventListener("click", () => {
                drumTrackStatus[trackIndex] = drumTrackStatus[trackIndex] === 1 ? 0 : 1;
                updateDrumTrackButtons(row, trackIndex);
                sendDrum("set-track-status", { track: trackIndex, value: drumTrackStatus[trackIndex] });
            });

            const steps = document.createElement("div");
            steps.className = "drum-track-steps";

            for (let step = 0; step < DRUM_STEP_COUNT; step++) {
                const cell = document.createElement("button");
                cell.type = "button";
                cell.className = "drum-step-cell";
                cell.dataset.track = trackIndex;
                cell.dataset.step = step;

                cell.addEventListener("click", () => {
                    const active = cell.classList.toggle("active");
                    sendDrum("set-step", { step, track: trackIndex, active });
                });

                steps.appendChild(cell);
            }

            const knobRack = document.createElement("div");
            knobRack.className = "drum-knob-rack";

            DRUM_TRACK_PARAMS[trackIndex].forEach(param => {
                const initialValue = param.key === "level" ? 1.0 : 0.5;

                const onChange = value => {
                    sendDrum(DRUM_PARAM_MESSAGE_TYPES[param.key], {
                        track: trackIndex,
                        value: mapDrumKnobValue(param.key, value)
                    });
                };

                knobRack.appendChild(createDrumKnob(param, initialValue, onChange));
            });

            row.append(trigger, mute, solo, steps, knobRack);
            drumSequencerEl.appendChild(row);
        });

        document.getElementById("drum-play").addEventListener("click", async () => {
            await startAudio();
            sendDrum("play");
        });

        document.getElementById("drum-pause").addEventListener("click", () => {
            sendDrum("pause");
        });

        document.getElementById("drum-stop").addEventListener("click", () => {
            sendDrum("stop");
        });

        document.getElementById("drum-bpm").addEventListener("change", event => {
            sendDrum("set-bpm", { value: Number(event.target.value) });
        });

        document.getElementById("drum-master-volume").addEventListener("input", event => {
            sendDrum("set-master-volume", { value: Number(event.target.value) });
        });

        // --- Tab switching (Synth / Drums) ----------------------------------
        //
        // Only toggles which view is visible -- both worklet nodes stay
        // connected and processing regardless, so switching tabs never
        // interrupts either engine's audio

        const synthView = document.getElementById("synth-view");
        const drumsView = document.getElementById("drums-view");
        const engineTabs = document.querySelectorAll(".engine-tab");

        engineTabs.forEach(tab => {
            tab.addEventListener("click", () => {
                const view = tab.dataset.view;

                synthView.hidden = view !== "synth";
                drumsView.hidden = view !== "drums";

                engineTabs.forEach(other => {
                    other.classList.toggle("active", other === tab);
                    other.setAttribute("aria-selected", other === tab ? "true" : "false");
                });
            });
        });
    </script>
</body>
</html>
